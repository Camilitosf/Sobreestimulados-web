<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sobreestimulados | Sitio oficial</title>
  <meta name="description" content="Sitio oficial de Sobreestimulados.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px;
      display: grid;
      place-items: center;
      background: #111116;
      color: #f5f5f7;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 760px;
    }

    .etiqueta {
      color: #b44219;
      letter-spacing: 3px;
      font-size: 13px;
      font-weight: bold;
    }

    h1 {
      margin: 20px 0;
      font-size: clamp(32px, 7vw, 64px);
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .descripcion {
      color: #555555;
      font-size: 20px;
      line-height: 1.6;
    }

    footer {
      margin-top: 64px;
      color: #777777;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main>
    <p class="etiqueta">PRÓXIMAMENTE</p>
    <h1>Sobreestimulados</h1>

    <p class="descripcion">
      Estamos preparando nuestro sitio.
      Muy pronto encontrarás novedades aquí.
    </p>

    <footer>Sobreestimulados · Sitio en construcción</footer>
  </main>
</body>
</html>
