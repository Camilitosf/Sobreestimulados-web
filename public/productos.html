<!doctype html><html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Productos | Sobreestimulados</title><link rel="canonical" href="https://sobreestimulados.cl/productos.html"><script src="/productos.js" defer></script><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#f5f5f5;font:16px/1.6 Arial,sans-serif}header,main{width:min(1200px,92%);margin:auto;padding:24px 0}a{color:#ff8a1e}h1{text-align:center}input,select,button{font:inherit;color:inherit;background:#141414;border:1px solid #555;border-radius:8px;padding:10px;min-height:44px}input,select{max-width:100%}button{cursor:pointer}label{display:block}a:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #ff5a1f;outline-offset:3px}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px}.filtros{padding:20px;background:#141414;border:1px solid #303030;border-radius:14px;align-self:start}.filtros input,.filtros select{width:100%;margin:6px 0 18px}.filtros h2{margin-top:0;font-size:20px}.barra{display:flex;flex-wrap:wrap;align-items:end;gap:16px;margin-bottom:20px}.busqueda{flex:1}.busqueda input{width:100%}.productos-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.producto{padding:18px;background:#141414;border:1px solid #303030;border-radius:16px;display:flex;flex-direction:column;min-width:0}.foto-producto{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:contain;border-radius:10px}.categoria{color:#ff8a1e;font-size:12px;margin-top:18px}.producto h3{font-size:18px}.precio{font-size:24px;font-weight:700}.precio small{font-size:13px}.boton{margin-top:auto;padding:12px;background:#ff5a1f;color:#000;border-radius:10px;text-align:center;text-decoration:none;font-weight:700}.producto[hidden]{display:none}.nota{color:#c7c7c7;font-size:14px}@media(max-width:1000px){.productos-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.layout{grid-template-columns:1fr}.productos-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.productos-grid{grid-template-columns:1fr}}</style></head><body><header><a href="/">← Volver a Sobreestimulados</a></header><main><h1>Productos</h1><p class="nota">Precios en pesos chilenos (CLP). Consulta disponibilidad, entrega y detalles por Instagram. Esta página no procesa pagos.</p><form id="filtros"><div class="layout"><aside class="filtros" aria-label="Filtros de productos"><h2>Filtros</h2><label for="minimo">Precio mínimo (CLP)</label><input id="minimo" type="number" min="0" step="1" placeholder="Desde"><label for="maximo">Precio máximo (CLP)</label><input id="maximo" type="number" min="0" step="1" placeholder="Hasta"><label for="tipo">Tipo de producto</label><select id="tipo"><option value="">Todos los tipos</option></select><button type="reset">Limpiar filtros</button></aside><section aria-label="Catálogo"><div class="barra"><div class="busqueda"><label for="buscar">Buscar productos</label><input id="buscar" type="search" placeholder="Sutura, modelo X, pines…" aria-controls="catalogo"></div><div><label for="orden">Ordenar por</label><select id="orden"><option value="catalogo">Orden del catálogo</option><option value="popularidad">Popularidad</option><option value="asc">Precio: menor a mayor</option><option value="desc">Precio: mayor a menor</option></select></div></div><p id="estado" role="status" aria-live="polite">Cargando catálogo…</p><p id="popularidad-nota" class="nota" hidden>Sin datos de popularidad todavía: se mantiene el orden del catálogo.</p><div id="catalogo" class="productos-grid"></div><noscript><p>Activa JavaScript para filtrar o <a href="/#productos">consulta el catálogo de inicio</a>.</p></noscript></section></div></form></main></body></html>
